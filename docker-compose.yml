name: spotit

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build: ./ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  trainer:
    profiles: [train]
    build:
      context: ./ai
      args:
        REQUIREMENTS: requirements-gpu.txt
    image: spotit-ai-gpu
    working_dir: /app
    entrypoint: ["python", "main.py"]
    environment:
      # TensorFlow ne trouve pas cuSOLVER tout seul dans les paquets pip de NVIDIA
      LD_LIBRARY_PATH: /usr/local/lib/python3.13/site-packages/nvidia/cusolver/lib
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/spotit}
    volumes:
      - ./ai:/app
      - ./archive:/dataset:ro
    gpus: all

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/spotit}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: 3000
      AI_URL: http://ai:5000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./flutter_application_1
      args:
        API_HOST: ${API_HOST:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
