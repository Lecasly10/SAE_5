server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le navigateur ne devine pas le type des fichiers, aucun autre site ne peut
    # afficher l'appli dans un cadre, et seule l'adresse du site est transmise
    # aux autres sites (OpenStreetMap la demande pour afficher la carte)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les noms de fichiers ne changent pas d'une version à l'autre : le
    # navigateur doit redemander s'ils ont changé, sinon il garde l'ancienne appli.
    # expires plutôt que add_header : un add_header ici effacerait ceux du dessus
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|mjs|wasm|json)$ {
        expires -1;
    }
}
