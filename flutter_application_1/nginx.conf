# Adresse du visiteur donnée par un proxy HTTPS placé devant (s'il y en a un),
# sinon celle de la connexion
map $http_x_real_ip $client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Le navigateur ne devine pas le type des fichiers, aucun autre site ne peut
    # afficher l'appli dans un cadre, et seule l'adresse du site est transmise
    # aux autres sites (OpenStreetMap la demande pour afficher la carte)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le serveur de l'appli à la même adresse : un seul sous-domaine en ligne.
    # Résolu à chaque requête pour que nginx démarre même si le backend redémarre.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une photo de 6 Mo fait environ 8 Mo une fois encodée
        client_max_body_size 10m;
        proxy_read_timeout 130s;
    }

    # Les noms de fichiers ne changent pas d'une version à l'autre : le
    # navigateur doit redemander s'ils ont changé, sinon il garde l'ancienne appli.
    # expires plutôt que add_header : un add_header ici effacerait ceux du dessus
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|mjs|wasm|json)$ {
        expires -1;
    }
}
